name: Publish

on:
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  publish:
    name: Pack and publish packages
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NUGET_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PACKAGE_SOURCE: https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Read package version
        id: version
        run: echo "package-version=$(dotnet msbuild src/Conventions.Testing.Analyzers/Conventions.Testing.Analyzers.csproj -nologo -getProperty:PackageVersion)" >> "$GITHUB_OUTPUT"

      - name: Restore locked dependencies
        run: dotnet restore Conventions.slnx --locked-mode

      - name: Build and test
        run: |
          dotnet build Conventions.slnx --configuration Release --no-restore
          dotnet test Conventions.slnx --configuration Release --no-build --no-restore

      - name: Pack packages
        run: >-
          dotnet pack Conventions.slnx
          --configuration Release
          --no-build
          --no-restore
          --output artifacts/packages

      - name: Publish packages
        run: >-
          dotnet nuget push artifacts/packages/*.nupkg
          --api-key "$NUGET_AUTH_TOKEN"
          --source "$PACKAGE_SOURCE"
          --skip-duplicate

      - name: Tag release
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.package-version }}
        run: |
          git tag "v${PACKAGE_VERSION}"
          git push origin "refs/tags/v${PACKAGE_VERSION}"
