name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: read

jobs:
  build:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@v6.1.0
        with:
          dotnet-version: "11.0.x"
          cache: true
          cache-dependency-path: |
            Directory.Packages.props
            **/*.csproj

      - name: Restore dependencies
        run: dotnet restore Conventions.slnx

      - name: Check formatting
        run: dotnet format Conventions.slnx --verify-no-changes --no-restore --severity warn

      - name: Build
        run: dotnet build Conventions.slnx -c Release --no-restore

      - name: Test
        run: dotnet test --solution Conventions.slnx -c Release --no-build --no-restore

      - name: Install minimum supported compiler
        uses: actions/setup-dotnet@v6.1.0
        with:
          dotnet-version: "11.0.100"

      - name: Verify analyzer rules run on the minimum compiler
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/Smoke.cs" <<'CS'
          namespace Xunit { public sealed class FactAttribute : System.Attribute { } }
          class Smoke
          {
              [Xunit.Fact]
              public void Broken(
                  int first,
                  int second) { }
          }
          CS
          dotnet "$DOTNET_ROOT/sdk/11.0.100/Roslyn/bincore/csc.dll" \
            -nologo -target:library -out:"$RUNNER_TEMP/Smoke.dll" \
            -reference:"$DOTNET_ROOT/packs/Microsoft.NETCore.App.Ref/11.0.0/ref/net11.0/System.Runtime.dll" \
            -analyzer:src/Conventions.Analyzers/bin/Release/netstandard2.0/Cntryl.Conventions.Analyzers.dll \
            -analyzer:src/Conventions.Testing.Analyzers/bin/Release/netstandard2.0/Cntryl.Conventions.Testing.Analyzers.dll \
            -warnaserror -warnaserror-:CNTRYL0001,CNTRYL0002,CNTRYL1001 "$RUNNER_TEMP/Smoke.cs" | tee "$RUNNER_TEMP/compiler.log"
          grep -F 'warning CNTRYL1001:' "$RUNNER_TEMP/compiler.log"
          grep -F 'warning CNTRYL0001:' "$RUNNER_TEMP/compiler.log"
          grep -F 'warning CNTRYL0002:' "$RUNNER_TEMP/compiler.log"
