name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: read

jobs:
  build:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore locked dependencies
        run: dotnet restore Conventions.slnx --locked-mode

      - name: Check formatting
        run: dotnet format Conventions.slnx --verify-no-changes --no-restore --severity warn

      - name: Build
        run: dotnet build Conventions.slnx -c Release --no-restore

      - name: Test
        run: dotnet test Conventions.slnx -c Release --no-build --no-restore

      - name: Set up minimum supported .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.100"

      - name: Verify analyzers load on the minimum supported compiler
        run: |
          dotnet --version
          dotnet build Conventions.slnx -c Release
