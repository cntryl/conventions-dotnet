name: Publish

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      pack-only:
        description: Upload the packages for the caller without publishing or tagging.
        type: boolean
        default: false
    outputs:
      artifact-id:
        description: The immutable package artifact for the caller.
        value: ${{ jobs.publish.outputs.artifact-id }}
      package-version:
        description: The version of the packed packages.
        value: ${{ jobs.publish.outputs.package-version }}

permissions:
  contents: write
  packages: write

jobs:
  publish:
    name: Pack and publish packages
    if: inputs.pack-only || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      artifact-id: ${{ steps.artifact.outputs.artifact-id }}
      package-version: ${{ steps.version.outputs.package-version }}
    env:
      NUGET_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PACKAGE_SOURCE: https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@v6.1.0
        with:
          dotnet-version: 11.0.x
          cache: true
          cache-dependency-path: |
            Directory.Packages.props
            **/*.csproj

      - name: Read package version
        id: version
        run: echo "package-version=$(dotnet msbuild src/Conventions.Testing.Analyzers/Conventions.Testing.Analyzers.csproj -nologo -getProperty:PackageVersion)" >> "$GITHUB_OUTPUT"

      - name: Restore dependencies
        run: dotnet restore Conventions.slnx

      - name: Build and test
        run: |
          dotnet build Conventions.slnx --configuration Release --no-restore
          dotnet test --solution Conventions.slnx --configuration Release --no-build --no-restore

      - name: Pack packages
        run: >-
          dotnet pack Conventions.slnx
          --configuration Release
          --no-build
          --no-restore
          --output artifacts/packages

      - name: Upload release packages
        if: inputs.pack-only
        uses: actions/upload-artifact@v7.0.2
        id: artifact
        with:
          name: release-packages-${{ github.run_attempt }}
          path: |
            artifacts/packages/*.nupkg
            artifacts/packages/*.snupkg
          if-no-files-found: error

      - name: Publish packages
        if: ${{ !inputs.pack-only }}
        run: >-
          dotnet nuget push artifacts/packages/*.nupkg
          --api-key "$NUGET_AUTH_TOKEN"
          --source "$PACKAGE_SOURCE"
          --skip-duplicate

      - name: Tag release
        if: ${{ !inputs.pack-only }}
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.package-version }}
        run: |
          git tag "v${PACKAGE_VERSION}"
          git push origin "refs/tags/v${PACKAGE_VERSION}"
